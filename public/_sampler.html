<!doctype html><meta charset=utf8><body style="margin:0;background:#0a3f30;padding:16px">
<div id=all style="display:flex;flex-wrap:wrap;gap:3px;max-width:1360px"></div>
<script src=/tiles-data.js></script>
<script>
const all=document.getElementById('all');
for(let k=0;k<34;k++){
  const d=window.MJ_TILE_DATA[k];
  const t=document.createElement('div');
  t.style.cssText='width:60px;height:84px;border-radius:9px;background:linear-gradient(158deg,#fffefb,#f3ecdc);box-shadow:0 7px 0 #a99a74,0 9px 7px rgba(0,0,0,.4);overflow:hidden;position:relative';
  t.innerHTML='<svg viewBox="'+d.vb+'" style="position:absolute;inset:8% 10% 11%;width:80%;height:81%">'+d.body+'</svg>';
  all.appendChild(t);
}
</script></body>
